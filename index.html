<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quiz PWA — Trắc nghiệm offline</title>
  <meta name="theme-color" content="#1a73e8" />
  <meta name="description" content="Trắc nghiệm từ Excel, chạy offline, lưu tiến độ + lịch sử." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="./css/app.css" />
  <script src="./vendor/xlsx.full.min.js"></script>
  <script src="./vendor/idb-keyval.umd.js"></script>
</head>

<body>
  <main class="container">
    <header class="topbar">
      <h1>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
        Quiz PWA
      </h1>
      <div class="topbar-actions">
        <div id="userInfo" style="display:none;" class="user-info">
          <span id="currentUserDisplay"></span>
          <a id="adminLink" href="./admin.html" class="ghost btn-sm" style="display:none;" title="Trang Admin">⚙️</a>
          <button id="logoutBtn" class="ghost icon-only" title="Đăng xuất">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>
        <button id="authBtn" class="ghost">👤 Đăng nhập</button>
        <button id="themeBtn" class="ghost icon-only" aria-label="Đổi giao diện">
          <svg id="iconSun" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg id="iconMoon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Màn hình yêu cầu đăng nhập -->
    <div id="loginWall"
      style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 60px 20px; text-align:center; gap:16px;">
      <svg style="width:64px;height:64px;color:var(--primary);opacity:0.7;" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
      <h2 style="margin:0;font-size:1.3rem;">Vui lòng đăng nhập</h2>
      <p style="margin:0;color:var(--text-muted);max-width:320px;">Đăng nhập để học bài, lưu tiến độ và đồng bộ dữ liệu
        trên mọi thiết bị.</p>
      <button id="loginWallBtn" style="margin-top:8px;padding:12px 32px;font-size:1rem;">👤 Đăng nhập / Đăng ký</button>
    </div>

    <!-- Nội dung chính (chỉ hiện khi đã đăng nhập) -->
    <div id="appContent" style="display:none;">

      <!-- Tabs -->
      <nav class="tabs">
        <button class="tab-btn active" data-tab="learn">📚 Học</button>
        <button class="tab-btn" data-tab="exam">📝 Thi</button>
        <button class="tab-btn" data-tab="review">❌ Câu sai</button>
        <button class="tab-btn" data-tab="history">📊 Lịch sử</button>
      </nav>

      <!-- ===== TAB HỌC ===== -->
      <div id="tab-learn" class="tab-content active">
        <div id="resumeBanner" class="banner" style="display:none;">
          <span id="resumeText"></span>
          <button id="resumeBtn">Tiếp tục</button>
          <button id="discardBtn" class="ghost">Bỏ</button>
        </div>

        <!-- Nhập mã tài liệu -->
        <section class="card">
          <h3 style="margin:0 0 12px;font-size:1rem;">🔑 Nhập mã tài liệu</h3>
          <div class="row">
            <input type="text" id="docCodeInput" placeholder="Nhập mã 6 ký tự..." maxlength="6"
              style="text-transform:uppercase;font-size:1.1rem;letter-spacing:3px;width:160px;" />
            <button id="loadCodeBtn">Tải tài liệu</button>
          </div>
          <div id="codeStatus" style="color:var(--text-muted);font-size:13px;margin-top:8px;"></div>
          <div id="codeSettings" class="row">
            <label>Số câu mỗi vòng:</label>
            <select id="numPerRoundCode">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="15">15</option>
              <option value="20" selected>20</option>
              <option value="30">30</option>
              <option value="50">50</option>
            </select>
            <button id="startFromCodeBtn">▶ Bắt đầu</button>
          </div>
        </section>

        <!-- Upload Excel -->
        <section class="card">
          <h3 style="margin:0 0 12px;font-size:1rem;">📂 Hoặc tải file Excel</h3>
          <div class="row">
            <input type="file" id="upload" accept=".xlsx,.xls" />
          </div>
          <div id="sheetSelector" class="row">
            <label for="sheetSelect">Sheet:</label>
            <select id="sheetSelect"></select>
            <button id="loadSheetBtn">Tải dữ liệu</button>
          </div>
          <div id="settings" class="row">
            <label for="numPerRound">Số câu/vòng:</label>
            <select id="numPerRound">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="15">15</option>
              <option value="20" selected>20</option>
              <option value="25">25</option>
              <option value="30">30</option>
              <option value="50">50</option>
            </select>
            <button id="startBtn">Bắt đầu</button>
          </div>
          <div id="status"></div>
        </section>

        <div id="quizArea" style="display:none;">
          <div id="roundInfo"></div>
          <div id="progress"></div>
          <div id="quiz"></div>
          <div class="actions">
            <button id="submitBtn" style="display:none;">Nộp bài</button>
            <button id="nextBtn" style="display:none;" class="ghost">Vòng tiếp theo</button>
          </div>
          <div id="result"></div>
        </div>
      </div>

      <!-- ===== TAB THI ===== -->
      <div id="tab-exam" class="tab-content">
        <section class="card">
          <!-- Nhập mã -->
          <div class="row">
            <label style="font-weight:600;">🔑 Thi từ mã tài liệu:</label>
            <input type="text" id="examCodeInput" placeholder="Mã 6 ký tự..." maxlength="6"
              style="text-transform:uppercase;letter-spacing:3px;width:160px;" />
            <button id="examLoadCodeBtn">Tải</button>
          </div>
          <div class="row" style="align-items:center;gap:8px;">
            <span style="color:var(--text-muted);font-size:13px;">— hoặc upload file —</span>
          </div>
          <div class="row">
            <label for="examUpload" style="font-weight:600;">📂 File Excel:</label>
            <input type="file" id="examUpload" accept=".xlsx,.xls" />
          </div>
          <div id="examSheetSelector" class="row">
            <label for="examSheetSelect">Sheet:</label>
            <select id="examSheetSelect"></select>
            <button id="examLoadSheetBtn">Tải dữ liệu</button>
          </div>
          <div id="examSettings" class="row">
            <label for="examNumPerRound">Số câu/vòng:</label>
            <select id="examNumPerRound">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="15">15</option>
              <option value="20" selected>20</option>
              <option value="25">25</option>
              <option value="30">30</option>
              <option value="50">50</option>
            </select>
          </div>
          <div id="examTimerSettings" class="row">
            <label for="examTimer">Thời gian:</label>
            <select id="examTimer">
              <option value="15">15 phút</option>
              <option value="30" selected>30 phút</option>
              <option value="45">45 phút</option>
              <option value="60">60 phút</option>
            </select>
          </div>
          <div id="examStartBtnRow" class="row">
            <button id="examStartBtn">🚀 Bắt đầu thi</button>
          </div>
          <div id="examStatus"></div>
        </section>

        <div id="examArea" style="display:none;">
          <div id="examTimerDisplay" class="timer-display"></div>
          <div id="examRoundInfo"></div>
          <div id="examProgress"></div>
          <div id="examQuiz"></div>
          <div class="actions">
            <button id="examSubmitBtn">📤 Nộp bài</button>
          </div>
          <div id="examResult"></div>
        </div>
      </div>

      <!-- ===== TAB CÂU SAI ===== -->
      <div id="tab-review" class="tab-content">
        <section class="card">
          <h2>❌ Câu sai của bạn</h2>
          <div id="reviewStatus"></div>
          <div id="reviewList"></div>
          <div class="actions">
            <button id="reviewPracticeBtn" style="display:none;">🔄 Ôn tập lại</button>
            <button id="reviewClearBtn" class="ghost" style="display:none;">🗑️ Xóa danh sách</button>
          </div>
        </section>
      </div>

      <!-- ===== TAB LỊCH SỬ ===== -->
      <div id="tab-history" class="tab-content">
        <section class="card">
          <h2>📊 Lịch sử làm bài</h2>
          <p id="historyLoginNote" style="color:var(--text-muted);font-size:14px;">
            💡 Đăng nhập để xem lịch sử từ mọi thiết bị.
          </p>
          <div id="historyList"></div>
        </section>
      </div>
    </div><!-- end #appContent -->
  </main>

  <!-- ===== MODAL AUTH ===== -->
  <div id="authModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-tabs">
        <button class="modal-tab active" id="tabLoginBtn">Đăng nhập</button>
        <button class="modal-tab" id="tabRegisterBtn">Đăng ký</button>
      </div>

      <div id="formLogin">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="email@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div id="loginError" class="auth-error"></div>
        <button id="loginEmailBtn" class="full-width">Đăng nhập</button>
        <div class="divider">hoặc</div>
        <button id="loginGoogleBtn" class="full-width ghost">
          <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Đăng nhập với Google
        </button>
      </div>

      <div id="formRegister" style="display:none;">
        <div class="form-group">
          <label>Họ tên</label>
          <input type="text" id="regName" placeholder="Nguyễn Văn A" autocomplete="name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="email@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="regPassword" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" />
        </div>
        <div id="registerError" class="auth-error"></div>
        <button id="registerBtn" class="full-width">Tạo tài khoản</button>
        <div class="divider">hoặc</div>
        <button id="registerGoogleBtn" class="full-width ghost">
          <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Đăng ký với Google
        </button>
      </div>
      <button id="closeAuthModal" class="modal-close" aria-label="Đóng">✕</button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>

</html>
